<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prendre Rendez-vous | Annacer Assurance</title>
    <meta name="description" content="Prenez rendez-vous avec nos experts en assurance à Sidi Kacem. Consultation gratuite et personnalisée.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">(function(){emailjs.init("vk3TsCj2TbhWy2OOB");})();</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{brand:{blue:'#002D62',red:'#E30613',slate:'#0F172A',gold:'#B89655',accent:'#F1F5F9',dark:'#020617'}},fontFamily:{sans:['Plus Jakarta Sans','sans-serif'],display:['Outfit','sans-serif']},borderRadius:{'4xl':'2rem','5xl':'3.5rem'}}}}</script>
    <style>
        :root{--primary:#002D62;--secondary:#E30613;--glass:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.1)}
        body{background-color:#020617;color:#f8fafc}
        .glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border)}
        .glass-dark{background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.05)}
        .reveal{opacity:0;transform:translateY(40px);transition:all 0.8s cubic-bezier(0.17,0.55,0.55,1)}
        .reveal.active{opacity:1;transform:translateY(0)}
        .nav-link::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:#E30613;transition:width 0.3s ease}
        .nav-link:hover::after,.nav-link.active::after{width:100%}
        ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:#020617}::-webkit-scrollbar-thumb{background:linear-gradient(var(--primary),var(--secondary));border-radius:5px}
    </style>
</head>
<body class="font-sans antialiased">
    <div class="fixed inset-0 pointer-events-none z-[100] opacity-[0.03]" style="background-image:url('https://grainy-gradients.vercel.app/noise.svg')"></div>

    <header id="navbar" class="fixed w-full z-[90] transition-all duration-500 py-6">
        <div class="max-w-7xl mx-auto px-6">
            <nav class="glass rounded-3xl px-8 py-4 flex justify-between items-center border-white/5">
                <a href="index.html" class="flex items-center space-x-4">
                    <div class="relative w-12 h-12 bg-brand-dark rounded-xl flex items-center justify-center text-white border border-white/10"><i class="fas fa-shield-halved text-brand-red text-xl"></i></div>
                    <div><span class="block text-xl font-black tracking-tighter uppercase leading-none">Annacer</span><span class="text-[10px] font-bold text-brand-red uppercase tracking-[0.3em]">Assurance & Conseil</span></div>
                </a>
                <div class="hidden lg:flex items-center space-x-10">
                    <ul class="flex space-x-8 text-[11px] font-extrabold uppercase tracking-widest">
                        <li><a href="index.html" class="nav-link text-slate-400 hover:text-white">Accueil</a></li>
                        <li><a href="about.html" class="nav-link text-slate-400 hover:text-white">À Propos</a></li>
                        <li><a href="services.html" class="nav-link text-slate-400 hover:text-white">Services</a></li>
                        <li><a href="blog.html" class="nav-link text-slate-400 hover:text-white">Blog</a></li>
                        <li><a href="faq.html" class="nav-link text-slate-400 hover:text-white">FAQ</a></li>
                        <li><a href="contact.html" class="nav-link text-slate-400 hover:text-white">Contact</a></li>
                    </ul>
                    <a href="tel:0537595910" class="bg-white text-brand-dark px-8 py-3 rounded-2xl font-black text-xs hover:bg-brand-red hover:text-white">05 37 59 59 10</a>
                </div>
            </nav>
        </div>
    </header>

    <section class="pt-48 pb-20">
        <div class="max-w-3xl mx-auto px-6">
            <div class="glass p-10 lg:p-16 rounded-5xl border-white/10 shadow-2xl reveal">
                <div id="form-header">
                    <h3 class="text-4xl font-black italic mb-4 uppercase">Prendre <span class="text-brand-red">Rendez-vous</span></h3>
                    <p class="text-slate-400 text-sm mb-10">Choisissez votre service, notre équipe vous rappellera pour confirmer.</p>
                </div>
                <form id="rdv-form" class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6">
                        <input type="text" id="client_name" placeholder="Nom Complet" required class="bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-sm text-white focus:outline-none focus:border-brand-red">
                        <input type="tel" id="client_phone" placeholder="Téléphone" required class="bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-sm text-white focus:outline-none focus:border-brand-red">
                    </div>
                    <select id="client_service" required class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-sm text-slate-400 focus:outline-none focus:border-brand-red">
                        <option class="bg-brand-dark" value="">Type de service...</option>
                        <option class="bg-brand-dark" value="Assurance Automobile">Assurance Automobile</option>
                        <option class="bg-brand-dark" value="Assurance Santé & Vie">Santé & Vie</option>
                        <option class="bg-brand-dark" value="Habitation">Habitation</option>
                        <option class="bg-brand-dark" value="Barid Cash">Barid Cash</option>
                        <option class="bg-brand-dark" value="Assurance Voyage">Assurance Voyage</option>
                    </select>
                    <button type="submit" id="submit-btn" class="w-full bg-brand-red text-white py-5 rounded-[2rem] font-black uppercase tracking-widest text-xs hover:scale-105 transition-transform shadow-xl shadow-brand-red/20 flex items-center justify-center gap-3">
                        <span>Confirmer ma demande</span>
                    </button>
                </form>
                <div id="success-message" class="hidden text-center py-10">
                    <div class="w-20 h-20 bg-brand-red rounded-full flex items-center justify-center mx-auto mb-8 shadow-lg shadow-brand-red/30"><i class="fas fa-check text-3xl text-white"></i></div>
                    <h4 class="text-2xl font-black uppercase italic mb-4">C'est fait !</h4>
                    <p class="text-slate-400 leading-relaxed mb-6">L'agence <span class="text-white font-black">Annacer</span> vous contactera sous peu.</p>
                    <button onclick="resetForm()" class="text-xs font-bold uppercase tracking-widest text-brand-red hover:text-white transition-colors">Faire une autre demande</button>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-brand-dark pt-32 pb-16 border-t border-white/5">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-[10px] font-black uppercase text-slate-600">&copy; 2026 Agence Annacer. Sidi Kacem.</p>
        </div>
    </footer>

    <script>
        window.addEventListener('scroll',()=>{const nav=document.getElementById('navbar');if(window.scrollY>100)nav.querySelector('nav').classList.add('glass-dark');else nav.querySelector('nav').classList.remove('glass-dark')});
        const observer=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('active')})},{threshold:0.1});
        document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
        document.getElementById('rdv-form').addEventListener('submit',function(e){
            e.preventDefault();
            const btn=document.getElementById('submit-btn'),orig=btn.innerHTML;
            btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Envoi...';btn.disabled=true;
            emailjs.send('service_rdh5hvr','template_ni1dhzi',{
                client_name:document.getElementById('client_name').value,
                client_phone:document.getElementById('client_phone').value,
                client_service:document.getElementById('client_service').value
            }).then(()=>{
                document.getElementById('form-header').classList.add('hidden');
                document.getElementById('rdv-form').classList.add('hidden');
                document.getElementById('success-message').classList.remove('hidden');
                btn.innerHTML=orig;btn.disabled=false;
            }).catch(()=>{alert('Erreur.');btn.innerHTML=orig;btn.disabled=false});
        });
        function resetForm(){
            document.getElementById('rdv-form').reset();
            document.getElementById('success-message').classList.add('hidden');
            document.getElementById('form-header').classList.remove('hidden');
            document.getElementById('rdv-form').classList.remove('hidden');
        }
    </script>
</body>
</html>
